<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喵咪電力公司搬家了</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#fff5e3; --card:#ffffff; --ink:#4a3426; --accent:#f08a24; --muted:#8a6f5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 16px; text-align:center; }
  .cat { font-size:5rem; line-height:1; }
  h1 { font-size:2.2rem; margin:16px 0 8px; }
  p { font-size:1.35rem; line-height:1.6; margin:8px 0; }
  p.muted { color:var(--muted); font-size:1.1rem; }
  a.go { display:inline-block; margin-top:24px; background:var(--accent); color:#fff;
         text-decoration:none; font-size:1.6rem; font-weight:bold; padding:18px 36px;
         border-radius:20px; box-shadow:0 4px 0 #c86c12; }
  a.go:active { transform:translateY(3px); box-shadow:0 1px 0 #c86c12; }
</style>
</head>
<body>
<main>
  <div class="cat">🐱🚚</div>
  <h1>喵咪電力公司搬家了！</h1>
  <p id="status">正在幫你打包遊戲進度…</p>
  <a class="go" id="go" href="#">前往新家</a>
  <p class="muted">以後請直接打開新網址；<br>加到主畫面的捷徑，也請用新網址重新加一次。</p>
</main>
<script src="../migrate.js"></script>
<script>
  MeowMigrate.run({
    target: MeowMigrate.NEW_ORIGIN + '/Meowatt/',
    statusEl: document.getElementById('status'),
    linkEl: document.getElementById('go'),
  });
</script>
</body>
</html>
