<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喵咪系列小遊戲</title>
<link rel="icon" href="Meowatt/index.icon.png">
<style>
  :root { --bg:#fff5e3; --card:#ffffff; --ink:#4a3426; --accent:#f08a24; --muted:#8a6f5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:2.2rem; text-align:center; margin:8px 0 4px; }
  p.sub { text-align:center; color:var(--muted); font-size:1.2rem; margin:0 0 28px; }
  a.game { display:flex; align-items:center; gap:16px; background:var(--card); color:var(--ink);
           text-decoration:none; border-radius:20px; padding:18px; margin-bottom:16px;
           box-shadow:0 4px 0 #ecd9bd; }
  a.game img { width:88px; height:88px; border-radius:18px; flex:none; }
  a.game b { display:block; font-size:1.6rem; }
  a.game span { font-size:1.1rem; color:var(--muted); }
  a.game:active { transform:translateY(3px); box-shadow:0 1px 0 #ecd9bd; }
</style>
</head>
<body>
<main>
  <h1>🐾 喵咪系列</h1>
  <p class="sub">給長輩玩的可愛貓咪益智遊戲</p>
  <a class="game" href="Meowatt/">
    <img src="Meowatt/index.icon.png" alt="">
    <div><b>喵咪電力公司</b><span>把同色的電廠和小屋連起來</span></div>
  </a>
</main>
</body>
</html>
